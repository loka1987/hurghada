
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurghada</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family:Arial;text-align:center;padding-top:50px;">

<h1>Welcome to Hurghada</h1>
<p>The future digital platform for Hurghada.</p>

<button id="loginBtn">Login with Pi</button>

<br><br>

<button id="payBtn">Pay with Pi</button>

<script>
Pi.init({
  version: "2.0",
  sandbox: false
});

let currentUser = null;

document.getElementById("loginBtn").addEventListener("click", async () => {
  try {
    currentUser = await Pi.authenticate(["username", "payments"]);
    alert("Welcome " + currentUser.user.username);
  } catch (err) {
    console.error(err);
    alert("Login failed");
  }
});

document.getElementById("payBtn").addEventListener("click", () => {
  if (!currentUser) {
    alert("Please login first.");
    return;
  }

  alert("Login successful!\nNext we will connect the real Pi payment.");
});
</script>

</body>
</html>
