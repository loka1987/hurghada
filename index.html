
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurghada</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family:Arial;text-align:center;padding-top:50px;">

<h1>Welcome to Hurghada</h1>
<p>The future digital platform for Hurghada.</p>

<button id="loginBtn">Login with Pi</button>

<br><br>

<button id="payBtn">Pay with Pi</button>

<script>
Pi.init({
  version: "2.0",
  sandbox: true
});

let currentUser = null;

document.getElementById("loginBtn").addEventListener("click", async () => {
  try {
    currentUser = await Pi.authenticate(["username", "payments"]);
    alert("Welcome " + currentUser.user.username);
  } catch (err) {
    console.error(err);
    alert("Login failed");
  }
});

document.getElementById("payBtn").addEventListener("click", async () => {
  if (!currentUser) {
    alert("Please login first.");
    return;
  }

  try {
    await Pi.createPayment(
      {
        amount: 0.01,
        memo: "Test Payment",
        metadata: { test: true }
      },
      {
        onReadyForServerApproval: function(paymentId) {
          console.log(paymentId);
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          console.log(paymentId, txid);
        },
        onCancel: function(paymentId) {
          console.log("Cancelled", paymentId);
        },
        onError: function(error) {
          console.error(error);
        }
      }
    );
  } catch (e) {
    console.error(e);
  }
});
</script>

</body>
</html>
